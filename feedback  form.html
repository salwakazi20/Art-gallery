
<html>
<head>
    <title>Feedback form</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        .error {
            color: red;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="feedbackForm" action="feedback.php" method="POST">
            <h1><b>Feedback form</b></h1>
            <hr><br><br>

            <label>Full name:</label>
            <input type="text" name="fname" id="fname" placeholder="Enter your name" required><br><br>

            <label>Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter email" required><br>
            <span id="emailError" class="error">Invalid email format</span><br><br>

            <label>Review/comments:</label>
            <textarea name="msg" rows="10" cols="50" required></textarea><br><br>

            <input type="submit" value="submit">
        </form>
    </div>

    <script>
        const form = document.getElementById('feedbackForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');

        form.addEventListener('submit', function(e) {
            const email = emailInput.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                e.preventDefault(); // Stop form submission
                emailError.style.display = 'inline';
            } else {
                emailError.style.display = 'none';
            }
        });
    </script>
</body>
</html>
