<html>
<head>
<title>Artist submission form</title>
<link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <form action="" method="get">
<h2><b>Artwork submission</b></h2>
<hr><br><br>
<label for="title">Title of Artwork:</label>
<input type="text" name="title" id="title" placeholder="Enter title" required><br><br>

<label for="name">Artist Name:</label>
<input type="text" name="name" id="name" placeholder="Enter your name"><br><br>

<label for="desc">Description:</label>
<textarea name="desc" rows="8" cols="100" id="desc" placeholder="Enter description"></textarea><br><br>

<label for="ctgry">Category:</label>
<input type="text" name="ctgry" id="ctgry" placeholder="Enter category" required><br><br>

<label for="dime">Dimension:</label>
<input type="number" name="dime" id="dime" placeholder="Enter dimension" required><br><br>

<label for="year">Year created:</label>
<input type="date" name="year" id="year" placeholder="Enter year"><br><br>

<label for="price">Price:</label>
<input type="number" name="price" id="price" placeholder="Enter price" required><br><br>

<label for="upload">Upload artwork image:</label>
<input type="image" name="upload" id="upload"><br><br>

<label for="addimage">Additional image:</label>
<input type="image" name="addimg" id="addimage"><br><br>

<input type="submit" value="Submit">

</body>
</html>
